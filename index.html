            function createOrganicTexture(baseColor) {
                const size = 256;

                c.height = size;
                const ctx = c.getContext('2d');
                const imageData = ctx.createImageData(size, size);
                const col = new THREE.Color(baseColor);
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const i = (y * size + x) * 4;
                        const nx = x / size - 0.5,
                            ny = y / size - 0.5;
                        const dist = Math.sqrt(nx * nx + ny * ny);
                        const bump = Math.sin(nx * 25) * Math.cos(ny * 20) * 0.15 + Math.sin(nx * 12 + ny * 15) * 0.1;
                        imageData.data[i] = Math.min(1, col.r + bump) * 255;
                        imageData.data[i + 1] = Math.min(1, col.g + bump * 0.9) * 255;
                        imageData.data[i + 2] = Math.min(1, col.b + bump * 0.8) * 255;
                        imageData.data[i + 3] = 255;
                    }
                }
                ctx.putImageData(imageData, 0, 0);
                return new THREE.CanvasTexture(c);

                const subId = initialSubId || (blobDataArg.subBlobs[0]?.id || '');
                overlayTitle.innerHTML =
                    `<i class="fas ${blobDataArg.icon||'fa-circle'}" style="color:${blobDataArg.color};"></i> ${blobDataArg.label}`;
                subNav.innerHTML = '';
                blobDataArg.subBlobs.forEach(sub => {
                    const btn = document.createElement('button');
                    btn.className = 'sub-nav-btn';
                    btn.textContent = sub.label;
                    btn.dataset.subId = sub.id;
                    btn.addEventListener('click', () => switchSubSection(blobDataArg, sub.id));
                    subNav.appendChild(btn);
                });
                switchSubSection(blobDataArg, subId);
                overlay.classList.add('active');
                overlayCard.scrollTop = 0;
                pageFooter.style.opacity = '0.3';
            }

            function switchSubSection(blobDataArg, subId) {
                overlayBody.innerHTML = '';
                const content = blobDataArg.content[subId] || '<p style="color:#94a3b8;">Content loading...</p>';
                const div = document.createElement('div');
                div.innerHTML = content;
                overlayBody.appendChild(div);
                subNav.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
                const ab = subNav.querySelector(`[data-sub-id="${subId}"]`);
                if (ab) ab.classList.add('active');
            }

            function hideOverlay() { overlay.classList.remove('active');
                expandedBlobData = null;
                subNav.innerHTML = '';
                overlayBody.innerHTML = '';
                pageFooter.style.opacity = '1'; }

            overlayBg.addEventListener('click', () => returnToGalaxy());
            overlayClose.addEventListener('click', () => returnToGalaxy());

            function returnToGalaxy() {
                if (state === 'galaxy') return;
                state = 'galaxy';
                expandedBlobId = null;
                expandedBlobData = null;
                expandedBlobGroup = null;
                hideOverlay();
                clearSubBlobMeshes();
                clearSubLabels();
                targetCameraPos.set(0, 0.4, 8.5);
                targetLookAt.set(0, 0, 0);
                allBlobObjects.forEach(g => {
                    g.userData.mat.emissiveIntensity = g.userData.baseEmissiveIntensity;
                    g.userData.mat.roughness = g.userData.baseRoughness;
                    g.userData.shellMat.opacity = g.userData.baseShellOpacity;
                    g.scale.set(1, 1, 1);
                });
                Object.values(labelEls).forEach(el => el.style.opacity = '1');
                pageFooter.style.opacity = '1';
            }

            function getIntersection(event) {
                const mouse = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window
                    .innerHeight) * 2 + 1);
                raycaster.setFromCamera(mouse, camera);
                const targets = state === 'galaxy' ? allBlobObjects : [...allBlobObjects, ...subBlobMeshes];
                const intersects = raycaster.intersectObjects(targets, true);
                if (intersects.length > 0) { let hit = intersects[0].object; while (hit) { if (hit.userData && (hit.userData
                            .isMainBlob || hit.userData.isSubBlob)) return hit;
                        hit = hit.parent; } }
                return null;
            }

            function handleClick(event) {
                const hit = getIntersection(event);
                if (!hit) { if (state === 'expanded' && !event.target.closest('#overlay-card') && !event.target.closest(
                        '.blob-label')) returnToGalaxy(); return; }
                if (state === 'galaxy' && hit.userData.isMainBlob) { const blobId = hit.userData.blobId; const dataItem =
                        blobData.find(b => b.id === blobId); if (dataItem) expandBlob(dataItem, blobObjectMap[
                    blobId]); } else if (state === 'expanded' && hit.userData.isSubBlob && hit.userData.subId) { if (
                        expandedBlobData) { switchSubSection(expandedBlobData, hit.userData.subId); const sGroup =
                            subBlobMeshes.find(m => m.userData.subId === hit.userData.subId); if (sGroup) { sGroup.scale
                                .set(1.5, 1.5, 1.5);
                            setTimeout(() => sGroup.scale.set(1, 1, 1), 280); } } }
            }

            function expandBlob(dataItem, blobGroup) {
                state = 'expanded';
                expandedBlobId = dataItem.id;
                expandedBlobData = dataItem;
                expandedBlobGroup = blobGroup;
                const tp = blobGroup.position.clone();
                const dir = tp.clone().normalize();
                targetCameraPos.copy(tp).add(dir.clone().multiplyScalar(isMobile ? 3.8 : 5.0));
                targetCameraPos.y += 0.5;
                targetLookAt.copy(tp);
                blobGroup.userData.mat.emissiveIntensity = 0.7;
                blobGroup.userData.mat.roughness = 0.15;
                blobGroup.userData.shellMat.opacity = 0.2;
                blobGroup.scale.set(1.3, 1.3, 1.3);
                allBlobObjects.forEach(g => {
                    if (g !== blobGroup) { g.userData.mat.emissiveIntensity = 0;
                        g.userData.mat.roughness = 0.85;
                        g.userData.shellMat.opacity = 0.015;
                        g.scale.set(0.85, 0.85, 0.85); }
                });
                Object.entries(labelEls).forEach(([id, el]) => { el.style.opacity = id === dataItem.id ? '1' :
                    '0.15'; });
                const subPositions = createSubBlobMeshes(dataItem, blobGroup);
                createSubLabels(dataItem, subPositions);
                showOverlay(dataItem, dataItem.subBlobs[0]?.id || '');
            }

            canvas.addEventListener('click', handleClick);
            canvas.addEventListener('pointerdown', e => { canvas.dataset.pdX = e.clientX;
                canvas.dataset.pdY = e.clientY; });
            window.addEventListener('mousemove', event => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
                cursorHint.style.left = event.clientX + 'px';
                cursorHint.style.top = event.clientY + 'px';
                const hit = getIntersection(event);
                if (hoveredBlob !== hit) {
                    if (hoveredBlob && hoveredBlob.userData.mat) {
                        if (hoveredBlob.userData.isMainBlob && hoveredBlob !== expandedBlobGroup) {
                            hoveredBlob.userData.mat.emissiveIntensity = (state === 'expanded' && hoveredBlob !==
                                expandedBlobGroup) ? 0 : hoveredBlob.userData.baseEmissiveIntensity;
                            hoveredBlob.userData.mat.roughness = (state === 'expanded' && hoveredBlob !==
                                expandedBlobGroup) ? 0.85 : hoveredBlob.userData.baseRoughness;
                        }
                        hoveredBlob.scale.lerp(new THREE.Vector3(1, 1, 1), 0.3);
                    }
                    hoveredBlob = hit;
                    if (hit && hit.userData.mat) {
                        hit.userData.mat.emissiveIntensity = 0.65;
                        hit.userData.mat.roughness = 0.15;
                        hit.scale.lerp(new THREE.Vector3(1.14, 1.14, 1.14), 0.3);
                        cursorHint.classList.add('visible', 'hovering');
                    } else { cursorHint.classList.remove('hovering'); if (!hit && state === 'galaxy') cursorHint
                            .classList.remove('visible'); }
                }
                if (!hoveredBlob) cursorHint.classList.remove('hovering');
                if (hoveredBlob || state === 'expanded') cursorHint.classList.add('visible');
            });
            canvas.addEventListener('touchstart', e => { if (e.touches.length === 1) { canvas.dataset.tsX = e.touches[0]
                    .clientX;
                    canvas.dataset.tsY = e.touches[0].clientY; } }, { passive: true });
            canvas.addEventListener('touchend', e => { const sx = parseFloat(canvas.dataset.tsX || 0); const sy = parseFloat(
                    canvas.dataset.tsY || 0); const ex = e.changedTouches[0]?.clientX || sx; const ey = e.changedTouches[
                    0]?.clientY || sy; if (Math.sqrt((ex - sx) ** 2 + (ey - sy) ** 2) < 15) handleClick({ clientX: ex,
                    clientY: ey }); });
            window.addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'expanded') returnToGalaxy(); });

            const clock = new THREE.Clock();
            let timeAccum = 0;

            function updateLabelPositions() {
                blobData.forEach(data => {
                    const g = blobObjectMap[data.id];
                    if (!g) return;
                    const sp = g.position.clone().project(camera);
                    const x = (sp.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-sp.y * 0.5 + 0.5) * window.innerHeight;
                    const el = labelEls[data.id];
                    if (el) { el.style.left = x + 'px';
                        el.style.top = (y - (isSmall ? 36 : isMobile ? 44 : 55)) + 'px';
                        el.style.opacity = sp.z > 1 ? '0' : (state === 'expanded' && data.id !== expandedBlobId ?
                            '0.14' : '1'); }
                });
                subLabelEls.forEach(({ el, worldPos }) => { const sp = worldPos.clone().project(camera); el.style.left = ((sp
                        .x * 0.5 + 0.5) * window.innerWidth) + 'px';
                    el.style.top = ((-sp.y * 0.5 + 0.5) * window.innerHeight - (isSmall ? 20 : 28)) + 'px';
                    el.style.opacity = sp.z > 1 ? '0' : '0.85'; });
            }

            function animate() {
                requestAnimationFrame(animate);
                const dt = Math.min(clock.getDelta(), 0.1);
                timeAccum += dt;
                camera.position.lerp(targetCameraPos, 0.04);
                currentLookAt.lerp(targetLookAt, 0.055);
                camera.lookAt(currentLookAt);
                if (state === 'galaxy') { const px = mouseX * 0.45,
                        py = mouseY * 0.35;
                    targetCameraPos.x = px;
                    targetCameraPos.y = 0.4 + py;
                    targetCameraPos.z = 8 + Math.abs(mouseX) * 0.4;
                    targetLookAt.set(px * 0.25, py * 0.25, 0); }
                allBlobObjects.forEach((group, i) => { const ud = group.userData; if (!ud.isMainBlob) return; const pulse = Math
                        .sin(timeAccum * ud.pulseSpeed + ud.pulseOffset) * 0.03; const base = (state === 'expanded' &&
                        group === expandedBlobGroup) ? 1.3 : 1; const hBonus = (group === hoveredBlob) ? 0.07 : 0;
                    const ts = base + pulse + hBonus;
                    group.scale.lerp(new THREE.Vector3(ts, ts, ts), 0.14); if (state === 'galaxy' || group !==
                        expandedBlobGroup) { const origPos = blobData[i]?.position || [0, 0, 0];
                        group.position.y += (origPos[1] + Math.sin(timeAccum * 0.38 + ud.pulseOffset) * 0.22 - group
                            .position.y) * 0.03;
                        group.position.x += (origPos[0] + Math.cos(timeAccum * 0.32 + ud.pulseOffset) * 0.18 - group
                            .position.x) * 0.03; } if (ud.halo) { ud.halo.rotation.z += dt * 0.2;
                        ud.halo.rotation.x += dt * 0.12; } });
                subBlobMeshes.forEach(group => { const ud = group.userData; if (ud.isSubBlob && ud.parentPos) { ud
                        .orbitAngle += dt * ud.orbitSpeed; const px = ud.parentPos.x + Math.cos(ud.orbitAngle) * ud
                        .orbitRadius; const py = ud.parentPos.y + Math.sin(ud.orbitAngle * 1.25) * ud
                        .orbitHeightOffset; const pz = ud.parentPos.z + Math.sin(ud.orbitAngle) * ud.orbitRadius *
                        0.65;
                    group.position.lerp(new THREE.Vector3(px, py, pz), 0.07);
                    group.scale.lerp(new THREE.Vector3(1 + Math.sin(timeAccum * 1.1 + ud.orbitAngle) * 0.025,
                        1 + Math.sin(timeAccum * 1.1 + ud.orbitAngle) * 0.025,
                        1 + Math.sin(timeAccum * 1.1 + ud.orbitAngle) * 0.025), 0.18); } });
                updateLabelPositions();
                if (!prefersReducedMotion) {
                    particles.rotation.y += dt * 0.03;
                    particles.rotation.x += dt * 0.01;
                    dropletGroup.children.forEach(d => { d.userData.orbitAngle += dt * d.userData.orbitSpeed;
                        d.position.x = Math.cos(d.userData.orbitAngle) * d.userData.orbitRadius;
                        d.position.z = Math.sin(d.userData.orbitAngle) * d.userData.orbitRadius - 2;
                        d.position.y = d.userData.orbitHeight + Math.sin(timeAccum * d.userData.floatSpeed) * d
                            .userData.floatAmp; });
                    motorGroup.children.forEach(m => { m.userData.angle += dt * m.userData.speed;
                        m.position.x = Math.cos(m.userData.angle) * m.userData.radius;
                        m.position.z = Math.sin(m.userData.angle) * m.userData.radius - 1;
                        m.position.y += (m.userData.height + Math.sin(timeAccum * 0.8) * 0.1 - m.position.y) * 0.1;
                        m.rotation.z = -m.userData.angle + Math.PI / 2; });
                    signalGroup.children.forEach(s => { if (!s.userData.active && Math.random() < 0.005) s.userData.active =
                            true; if (s.userData.active) { s.userData.life += dt; if (s.userData.life > s.userData
                                .maxLife) { s.position.set((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 12, -
                                    20 - Math.random() * 15);
                                s.userData.life = 0;
                                s.userData.speed = 0.25 + Math.random() * 0.5;
                                s.userData.maxLife = 2 + Math.random() * 3; } s.position.z += s.userData.speed;
                            s.children[0].material.opacity = 1 - s.userData.life / s.userData.maxLife;
                            s.children[1].material.opacity = 0.5 * (1 - s.userData.life / s.userData.maxLife); } });
                }
                renderer.render(scene, camera);
            }
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight); }, { passive: true });
            cursorHint.classList.add('visible');
            setTimeout(() => { if (!hoveredBlob && state === 'galaxy') cursorHint.classList.remove('visible'); }, 3000);
            animate();
            console.log('%c🧬 Updated molecular portfolio ready!', 'color:#22d3bb;font-size:1rem;');
        })();
    </script>
</body>
</html>
